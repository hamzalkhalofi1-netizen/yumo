kind = "mobile"
previewPath = "/"
title = "Yomu AI"
version = "1.0.0"
id = "artifacts/yomu-ai"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 22482

[services.development]
run = "pnpm --filter @workspace/yomu-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/yomu-ai", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/yomu-ai", "run", "serve" ]

[services.env]
PORT = "22482"
BASE_PATH = "/"
