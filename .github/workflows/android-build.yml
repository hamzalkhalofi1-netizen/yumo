name: Android Build
on:
  push:
    branches: [ main, رئيسي ] # غايخدم سواء سميت الفرع main أو رئيسي

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        # هاد السطر هو الساروت باش يعرف GitHub فين كاين المشروع
        working-directory: artifacts/yomu-ai
        run: npm install

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: Build APK (Preview)
        working-directory: artifacts/yomu-ai
        run: eas build --platform android --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          
