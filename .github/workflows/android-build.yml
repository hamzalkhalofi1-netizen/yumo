name: Android Build
on:
  push:
    branches: [ main, رئيسي ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Force Build via Expo
        working-directory: artifacts/yomu-ai
        # هاد السطر غايتجاوز الـ preinstall اللي مبرزطاك
        run: |
          npx eas-cli build --platform android --profile preview --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          
