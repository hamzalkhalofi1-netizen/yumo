name: Android Build
on:
  push:
    branches: [ main, رئيسي ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8 # نسخة مستقرة

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'pnpm'
          cache-dependency-path: artifacts/yomu-ai/package.json

      - name: Install Dependencies
        working-directory: artifacts/yomu-ai
        # استعملنا pnpm install حيت هي اللي كتفهم البروتوكولات ديال المشروع ديالك
        run: pnpm install --no-frozen-lockfile

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: Build APK (Preview)
        working-directory: artifacts/yomu-ai
        run: eas build --platform android --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          
