name: Android Build
on:
  push:
    branches: [ main, رئيسي ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: Build APK (Preview)
        # هنا كنقولو لـ Expo: "خود الكود كيفما هو ودبر راسك فـ الـ Dependencies فـ السيرفر ديالك"
        working-directory: artifacts/yomu-ai
        run: eas build --platform android --profile preview --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          
